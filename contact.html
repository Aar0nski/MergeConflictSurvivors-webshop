<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
      <header>
          <nav>
              <a href="index.html">Home</a> | <a href="checkout.html">Checkout</a> |
              <a href="product.html">Product</a> | <a href="about.html">About</a> |
              <a href="contact.html">Contact</a>

              <button id="themeToggle" class="theme-toggle" type="button">
                  🌙 Dark
              </button>
          </nav>
      </header>
      <section class="page-layout">
          <div>
              <h1>Contact Info</h1>
              <p>If you have any questions, please feel free to contact us by email: <br> info@mybestbackpack.com</p>
              <p>Or by phone:<br> 111-987 654 321</p>
              <img src="images/image5.jpg"
                   alt="Small image"
                   width="150"
                   height="150" />
          </div>
      </section>
      <!-- Links to all 5 pages. -->
      <script>
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("themeToggle");
    if (!btn) return;

    function updateButton() {
      const isDark = document.body.classList.contains("dark");
      btn.textContent = isDark ? "☀️ Light" : "🌙 Dark";
    }

    const saved = localStorage.getItem("theme");
    if (saved === "dark") document.body.classList.add("dark");

    updateButton();

    btn.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      updateButton();
    });
  });
      </script>

  </body>
</html>
