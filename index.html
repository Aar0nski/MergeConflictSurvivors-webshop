<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a> | <a href="checkout.html">Checkout</a> |
        <a href="product.html">Product</a> | <a href="about.html">About</a> |
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <section class="page-layout">
      <div>
        <h1>Home</h1>
        <p>Welcome to this page (Home)</p>
        <a href="https://www.google.com/imghp" target="_blank">
          <img
            src="images/image1.jpg"
            alt="Small image"
            width="150"
            height="150"
          />
        </a>
      </div>
      <div class="joke-container">
        <button onclick="loadJoke()">Get a new joke</button>

        <p id="joke"></p>
      </div>
    </section>

    <script>
      // Hämta paragrafen där skämtet ska visas
      const jokeElement = document.getElementById("joke");

      // Funktion som hämtar ett nytt skämt
      function loadJoke() {
        // Visa laddningstext medan vi väntar
        jokeElement.textContent = "Laddar skämt...";

        // Anropa API:et för att få ett slumpmässigt skämt
        fetch("https://official-joke-api.appspot.com/random_joke")
          .then(function (response) {
            // Gör om svaret till JSON
            return response.json();
          })
          .then(function (joke) {
            // Visa skämtet på sidan
            jokeElement.textContent = joke.setup + " — " + joke.punchline;
          })
          .catch(function () {
            // Om något går fel, visa ett felmeddelande
            jokeElement.textContent = "Kunde inte ladda skämt 😢";
          });
      }

      // Ladda ett skämt automatiskt när sidan öppnas
      loadJoke();
    </script>
  </body>
</html>
