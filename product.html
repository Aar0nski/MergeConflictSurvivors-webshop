<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a> | <a href="checkout.html">Checkout</a> |
        <a href="product.html">Product</a> | <a href="about.html">About</a> |
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <section class="page-layout">
      <div>
        <h1>Best backpack in the world!</h1>
        <p>This is the best backpack in the world!</p>
        <p>Price = 200$</p>
        <p>Take it or leave it</p>
        <img
          src="images/Ryggsäck.jpg"
          alt="Ryggsäck"
          width="350"
          height="350"
        />
      </div>
      <button class="add-btn" onclick="addToCart()">Add to cart</button>
      <p class="toast" id="toast">Added backpack to cart</p>
    </section>

    <script>
      function addToCart() {
        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        let id;
        if (cart.length === 0) {
          id = 1;
        } else {
          const maxId = Math.max(...cart.map((item) => item.id));
          id = maxId + 1;
        }

        if (cart.length > 1) {
          id = id + 1;
        }
        const backpack = {
          name: "Best Backpack in the World",
          price: 200,
          id: id,
        };
        cart.push(backpack);

        localStorage.setItem("cart", JSON.stringify(cart));
        const toast = document.querySelector(".toast");

        toast.classList.add("show");

        setTimeout(() => {
          toast.classList.remove("show");
        }, 1000);
      }
    </script>
  </body>
</html>
