<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a> | <a href="checkout.html">Checkout</a> |
        <a href="product.html">Product</a> | <a href="about.html">About</a> |
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <section class="page-layout">
      <div>
        <h1>Checkout</h1>

       
        <div id="cart">
		
			
        </div>

        <div class="buy-container" id="total-price">
         
		  <!-- ändra så den är dynamisk  -->
          <button>Buy</button>
        </div>
      </div>
    </section>
	<script>
		const cart = JSON.parse(localStorage.getItem("cart")) || [];


		const cartDiv = document.getElementById("cart");
		
		if (cart.length > 0) {
	const quantity = cart.length
  const div = document.createElement("div");
  div.classList.add("prod-card");

  const img = document.createElement("img");
  img.src = "images/Ryggsäck.jpg";
  img.alt = "backpack";
  img.classList.add("img");

  const name = document.createElement("p");
  name.textContent = cart[0].name;
 const priceQtyDiv = document.createElement("div")
 priceQtyDiv.style.display = "flex"
  const qty = document.createElement("p");
  qty.textContent = `${quantity}psc/ `;
  const price = document.createElement("p");

  priceQtyDiv.classList.add("place-end");
  price.textContent = `${cart[0].price}$`;

  const total = document.getElementById("total-price")
  const totalP = document.createElement("p")
  totalP.textContent =`${cart[0].price * quantity}$`
  

  priceQtyDiv.appendChild(qty)
  priceQtyDiv.appendChild(price)

  div.appendChild(img);
  div.appendChild(name);
  div.appendChild(priceQtyDiv);

  cartDiv.appendChild(div);
  total.prepend(totalP)
  console.log(cart);
  
}
;
	</script>
  </body>
</html>
