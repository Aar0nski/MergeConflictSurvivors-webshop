<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
      <header>
          <nav>
              <a href="index.html">Home</a> | <a href="checkout.html">Checkout</a> |
              <a href="product.html">Product</a> | <a href="about.html">About</a> |
              <a href="contact.html">Contact</a>

              <button id="themeToggle" class="theme-toggle" type="button">
                  🌙 Dark
              </button>
          </nav>
      </header>
      <section class="page-layout">
          <div>
              <h1>Checkout</h1>

              <!-- add JS to make it possible to add products?  -->
              <div class="prod-card">
                  <img src="" alt="backpack" />
                  <p>Best backpack in the world</p>
                  <p class="place-end">Price: 200$</p>
              </div>

              <div class="buy-container">
                  <p>Total price: 200$</p>
                  <button>Buy</button>
              </div>
          </div>
      </section>
      <script>
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.getElementById("themeToggle");
    if (!btn) return;

    function updateButton() {
      const isDark = document.body.classList.contains("dark");
      btn.textContent = isDark ? "☀️ Light" : "🌙 Dark";
    }

    const saved = localStorage.getItem("theme");
    if (saved === "dark") document.body.classList.add("dark");

    updateButton();

    btn.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      updateButton();
    });
  });
      </script>

  </body>
</html>
